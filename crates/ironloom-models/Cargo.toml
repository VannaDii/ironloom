[package]
name = "ironloom-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Ironloom model, engine, source and device adapter contracts."

[features]
embedded-mistral = ["dep:mistralrs"]

[dependencies]
tar.workspace = true
flate2.workspace = true
mistralrs = { workspace = true, optional = true }
tempfile.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
ironloom-queue = { path = "../ironloom-queue", version = "0.1.0" }
futures-util.workspace = true
reqwest.workspace = true
ironloom-observability = { path = "../ironloom-observability", version = "0.1.0" }
url.workspace = true
tokio.workspace = true
ironloom-workers = { path = "../ironloom-workers", version = "0.1.0" }
ironloom-policy = { path = "../ironloom-policy", version = "0.1.0" }
ironloom-core = { path = "../ironloom-core", version = "0.1.0" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true


# Metal SDK source is compiled only on its authorized target host, never on Linux build agents.
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { workspace = true, optional = true, features = ["metal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
