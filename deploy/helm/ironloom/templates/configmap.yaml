apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ironloom.fullname" . }}-config
  labels:
    {{- include "ironloom.labels" . | nindent 4 }}
data:
  IRONLOOM_BIND_ADDR: {{ .Values.runtime.bindAddress | quote }}
  IRONLOOM_PUBLIC_URL: {{ .Values.runtime.publicUrl | quote }}
  IRONLOOM_STATE_ROOT: {{ .Values.runtime.stateMountPath | quote }}
  IRONLOOM_WORKTREE_ROOT: {{ .Values.runtime.worktreeMountPath | quote }}
  IRONLOOM_LOG_LEVEL: {{ .Values.observability.logLevel | quote }}
{{ if .Values.discord.applicationId }}
  IRONLOOM_DISCORD_APPLICATION_ID: {{ .Values.discord.applicationId | quote }}
{{ end }}
{{ if .Values.sonarcloud.organization }}
  IRONLOOM_SONARCLOUD_ORGANIZATION: {{ .Values.sonarcloud.organization | quote }}
{{ end }}
{{ if .Values.sonarcloud.projectKey }}
  IRONLOOM_SONARCLOUD_PROJECT_KEY: {{ .Values.sonarcloud.projectKey | quote }}
{{ end }}
  IRONLOOM_DOWNLOAD_MAX_FILE_BYTES: {{ required "download.maxFileBytes is required" .Values.download.maxFileBytes | quote }}
  IRONLOOM_DOWNLOAD_MAX_TRANSFER_BYTES: {{ required "download.maxTransferBytes is required" .Values.download.maxTransferBytes | quote }}
  IRONLOOM_OPENFGA_URL: {{ required "openfga.url is required" .Values.openfga.url | quote }}
  IRONLOOM_NODE_ID: {{ required "runtime.nodeId is required" .Values.runtime.nodeId | quote }}
  IRONLOOM_PROJECTS_ROOT: {{ required "runtime.projectsMountPath is required" .Values.runtime.projectsMountPath | quote }}
  IRONLOOM_MODELS_ROOT: {{ required "runtime.modelsMountPath is required" .Values.runtime.modelsMountPath | quote }}
