[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/VannaDii/ironloom"
homepage = "https://ironloom.dev"
publish = false

[workspace.dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", rev = "21da642fdd2210c30ca4028e1eabdd28e9c602fd", default-features = false, features = ["ring"] }
tar = "=0.4.46"
flate2 = "=1.1.11"
ironloom-service = { path = "crates/ironloom-service", version = "0.1.0" }
futures-util = "=0.3.34"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-stream = "=0.1.19"
argon2 = "=0.6.0"
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }
nix = { version = "=0.32.0", features = ["fs", "signal", "process"] }

axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "signal", "io-util", "process", "time", "net", "fs"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
serde_path_to_error = "=0.1.20"
aes-gcm = "0.10.3"
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
schemars = { version = "=1.2", features = ["derive", "uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.11"
tempfile = "3.23.0"
thiserror = "2.0.17"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
